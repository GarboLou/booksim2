// Deadlock-guard case: the VC0 switch model
// with one header and 256 B of data credit per type, so four
// pinned 64 KiB flows on a cycle of per-bridge routes deadlock without
// admission. Run from the booksim2 root.
topology            = pcinet;
network_file        = tests/topo/guard_mesh4.txt;
routing_function    = min;
sim_type            = flow;          // externally driven: the frontend owns the clock

num_vcs             = 4;
vc_buf_size         = 32;
output_buffer_size  = 4;             // must be finite whenever any link is derated

// Unit system: 1 flit = 64 B, 1 cycle = 1 ns, so Gen5 x16 == 1 flit/cycle.
flit_bytes              = 64;
pcie_mps                = 256;       // TODO calibrate from lspci -vv
pcie_tlp_overhead_bytes = 24;        // header + sequence + LCRC + framing
max_queued_packets      = 8;

credit_delay     = 2;
routing_delay    = 0;
vc_alloc_delay   = 1;
sw_alloc_delay   = 1;
st_final_delay   = 1;
vc_allocator     = islip;
sw_allocator     = islip;
alloc_iters      = 2;

// ---- PCIe VC0 switch, one queue per (type, egress of the next switch),
// ---- appended by utils/vc0_config.py
speculative            = 1;   // back-to-back TLPs on one queue, no idle cycle
noq                    = 1;   // sort by next egress on arrival
noq_vcs_per_output     = 1;   // exactly one queue per (type, egress)
num_vcs                = 12;  // 3 types x max switch radix 4
write_request_begin_vc = 0; write_request_end_vc = 3;
read_request_begin_vc = 4; read_request_end_vc = 7;
read_reply_begin_vc = 8; read_reply_end_vc = 11;
pcie_default_class     = P;   // untagged (SimAI) flows
buffer_policy          = shared;   // one pool per type per ingress
pcie_credits           = 1;   // storage derived from these; 0 = infinite
pcie_ph = 1; pcie_pd_bytes = 256;       // TODO calibrate
pcie_nph = 1; pcie_npd_bytes = 256;     // TODO calibrate
pcie_cplh = 1; pcie_cpld_bytes = 256;   // TODO calibrate
