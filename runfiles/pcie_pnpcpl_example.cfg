// Worked example: P/NP/Cpl credit-pool separation on top of the mesh_grid
// topology. This separates the credit pools of the three types; it does not
// enforce PCIe's ordering rules (e.g. a posted write must not pass an earlier
// posted write).
//
// Tag a flow's pcie_class via FlowDesc::pcie_class (API) or `class=P|NP|Cpl`
// (trace format, see utils/trace_io.py / src/tools/booksim_flowtest.cpp).
// Untagged flows are unaffected -- they still get the full, undivided VC pool.
//
//   cd booksim2
//   src/tools/booksim_flowtest runfiles/pcie_pnpcpl_example.cfg <trace> --csv out.csv
topology            = pcinet;
network_file        = runfiles/pcie_simai_mesh_grid.txt;
routing_function    = min;
sim_type            = flow;

num_vcs                 = 6;   // was 4 (see simai_mesh_grid.cfg): +2 so
                                // Non-Posted and Completion each get their
                                // own pool without shrinking Posted's share
write_request_begin_vc  = 0;  write_request_end_vc  = 1;  // Posted
read_request_begin_vc   = 2;  read_request_end_vc   = 3;  // Non-Posted
read_reply_begin_vc      = 4;  read_reply_end_vc     = 5;  // Completion
// write_reply_begin_vc / write_reply_end_vc intentionally left unset: no
// pcie_class value ever maps to Flit::WRITE_REPLY, matching real PCIe --
// posted writes never generate a reply.

vc_buf_size         = 32;
output_buffer_size  = 4;             // must be finite whenever any link is derated
buffer_policy       = private;       // required -- see FlowTrafficManager's
                                       // startup check (shared would silently
                                       // recouple the separated VC ranges)

flit_bytes              = 64;
pcie_mps                = 256;
pcie_tlp_overhead_bytes = 24;
max_queued_packets      = 8;

credit_delay     = 2;
routing_delay    = 0;
vc_alloc_delay   = 1;
sw_alloc_delay   = 1;
st_final_delay   = 1;
vc_allocator     = islip;
sw_allocator     = islip;
alloc_iters      = 2;
